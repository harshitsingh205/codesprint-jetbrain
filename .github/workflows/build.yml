name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Test, verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin ZIP
        run: |
          ./gradlew buildPlugin --stacktrace > build.log 2>&1 || {
            echo "## Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit 1
          }

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: codesprint-jetbrains
          path: build/distributions/*.zip
