name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Test, verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin ZIP
        run: |
          ./gradlew buildPlugin --stacktrace 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            ERROR_MSG=$(grep -E "^e: " build.log | head -n 10 | tr '\n' ' ')
            if [ -z "$ERROR_MSG" ]; then
              ERROR_MSG=$(tail -n 25 build.log | tr '\n' ' ')
            fi
            echo "::error title=KotlinError::$ERROR_MSG"
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: codesprint-jetbrains
          path: build/distributions/*.zip
