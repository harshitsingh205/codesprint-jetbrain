# Plugin identity (the plugin id in plugin.xml can never change after the first release)
pluginGroup = com.codesprint.ide
pluginName = CodeSprint
pluginVersion = 1.0.2

# Supported IDE build range.
# 233 = 2023.3 (Android Studio Iguana / Jellyfish line). No upper bound is declared.
pluginSinceBuild = 233

# IDE used to compile against and to run with ./gradlew runIde.
# IC = IntelliJ IDEA Community. The plugin only needs the shared platform module,
# so the same build runs on Android Studio, IDEA, PyCharm, WebStorm, GoLand, etc.
platformType = IC
platformVersion = 2023.3.8

# Kotlin: the IDE already ships its own stdlib, never bundle a second copy.
kotlin.stdlib.default.dependency = false

# org.gradle.jvmargs = -Xmx2g
org.gradle.configuration-cache = false
org.gradle.caching = true
